<dialog id="history-dialog" class="history-dialog"
    aria-labelledby="history-dialog-title">
  <div class="history-dialog-header">
    <div class="history-dialog-title">
      <h2 id="history-dialog-title">Query history</h2>
      <span class="history-dialog-count"></span>
    </div>
    <button type="button" class="history-dialog-close"
        aria-label="Close">&times;</button>
  </div>
  <div class="history-dialog-body">
    <div class="history-dialog-left">
      <div class="history-dialog-list" role="listbox" tabindex="0"
          aria-label="History entries"></div>
      <div class="history-dialog-bar">
        <button type="button"
            class="history-dialog-clear">Clear all history</button>
      </div>
    </div>
    <div class="history-dialog-side">
      <div class="history-preview" aria-label="Preview">
        <span class="history-preview-label" aria-hidden="true">Preview</span>
        <pre class="history-preview-query"></pre>
        <div class="history-preview-settings"></div>
      </div>
      <div class="history-dialog-bar history-preview-actions">
        <button type="button" class="history-delete">Delete</button>
        <button type="button" class="history-load">Load</button>
        <button type="button" class="history-run"
            title="Load and submit the query">Run</button>
      </div>
    </div>
  </div>
</dialog>
